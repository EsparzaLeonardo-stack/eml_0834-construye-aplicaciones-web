<!DOCTYPE html>
<html lang="es"> <!-- define el idioma de la pagina en español -->
<head>
<meta charset="UTF-8"> <!-- Esto permite usar varios caracteres y simbolos de varios idiomas especificamente acentos y la ñ para el español -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<!-- ajusta la pagina para que se pueda ver correctamente en un monitor o en celular (hice mucho en celular)  -->
<title>Mes Patrio | Inicio</title> <!-- titulo que aparece en la pestaña del navegador -->
<style> 
/* esta parte define los colores o la paleta de colores de la pagina inicial */
  :root {
    --verde: #0f6f4f;
    --verde-osc: #0a4f38;
    --rojo: #e31b23;
    --crema: #f4f1ea;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; } /* quitamos margenes */
  /* Configuramos la fuente y altura del fondo osea de la pagina */
  body {
    font-family: system-ui, sans-serif; /*Utiliza la tipografia determinada del sistema operativo*/
    background: var(--crema); /* Color del fondo */
    color: #1a1a1a; /* aplica color a la tipografia es un gris oscuro */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; } /* Centra la pagina */
  nav { /* esta es la barra superior la de las opciones */
    display: flex;
    gap: 8px; /* pone una separacion de 8 pixeles entre boton */
    flex-wrap: wrap;
    justify-content: center; /* alinea al centro de la barra los botones */
    background: var(--blanco); /* aplica color a la opcion (boton)*/
    padding: 10px; /* pone un espacio de 10 pixeles entre los bordes de la barra y los botones*/
    border-radius: 50px; /* redondea los bordes de la barra */
    margin-bottom: 25px; /* separa la barra 25 pixeles del resto del contenido */
  }
  nav a { /* aqui se define el estilo visual de los botones */
    color: var(--verde-osc); /* define el color del texto dentro de los botones */
    border: 2px solid var(--verde); /* le pone borde a los botones de 2 pixeles con un color verde mas claro que el de las letras*/
    padding: 6px 14px; /*aplica espacio interno entre el texto y los bordes de la pagina, 6 pixeles de arriba y de abajo y 14 pixeles a los lados*/
    border-radius: 20px; /*redonde los bordes de los botones*/
    text-decoration: none; /*quita el subrayado que traen los enlaces por defecto.*/
    font-weight: 700; /*aplica grosor en la negrita*/
    font-size: 0.85rem; /*reduce el tmañao del texto un 85% respecto al tamaño del documento*/
    text-transform: uppercase; /*convierte todo el texto dle enlace en mayusculas*/
  }
  /* cambia el fondo a verde y letras a blanco al pasar el mouse o al estar seleccionado el boton */
  nav a.active, nav a:hover { background: var(--verde); color: var(--blanco); }
  
  /* estilo de la tarjeta contenedora central con fondo blanco, bordes redondeados y sombra suave */
  .card {
    background: var(--blanco);
    border-radius: 24px;
    padding: 30px 20px;                                 
    text-align: center; /* centra todo el texto dentro de la tarjeta */
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* le da un efecto de sombra ligera para levantar el cuadro */
  }
  /* estilo para el subtitulo superior en rojo con letras mas gruesas y separadas */
  .sub { color: var(--rojo); font-weight: 900; letter-spacing: 2px; }
  
  /* titulo gigante principal que escala de tamaño segun el tamaño de la pantalla */
  h1 { color: var(--verde); font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 900; margin: 5px 0 15px; }
  
  /* contenedor de la imagen para centrarla y cortarla con bordes redondeados */
  .img-box { max-width: 650px; margin: 0 auto 20px; border-radius: 20px; overflow: hidden; }
  
  /* ajusta la imagen para que llene el contenedor sin deformarse */
  .img-box img { width: 100%; height: 300px; object-fit: cover; display: block; }
  
  /* cuadro de descripcion verde abajo de la foto con texto blanco */
  .desc {
    background: var(--verde);
    color: var(--blanco);
    padding: 20px;
    border-radius: 16px;
    max-width: 650px;
    margin: 0 auto;
    font-weight: 600;
  }
  /* estilo del pie de pagina que lo manda al fondo de la pantalla con letras blancas sobre verde oscuro */
  footer { background: var(--verde-osc); color: var(--blanco); text-align: center; padding: 15px; font-weight: 700; margin-top: auto; }
</style>
</head>
<body>

<!-- contenedor general que envuelve la estructura central -->
<div class="wrap">
  <!-- barra de navegacion con los enlaces a las diferentes secciones del sitio web -->
  <nav>
    <a href="01-index.html" class="active">Inicio</a> <!-- boton activo marcado para la pagina actual -->
    <a href="02-introduccion.html">Introducción</a>
    <a href="03-fechas.html">Fechas</a>
    <a href="04-datos.html">Datos Curiosos</a>
    <a href="05-mitos.html">Mitos</a>
    <a href="06-personajes.html">Personajes</a>
    <a href="07-ninos-heroes.html">Niños Héroes</a>
  </nav>

  <!-- tarjeta principal donde viene todo el contenido representativo de inicio -->
  <div class="card">
    <div class="sub">SEPTIEMBRE MES PATRIO</div> <!-- texto corto decorativo encima del titulo principal -->
    <h1>MÉXICO</h1> <!-- titulo principal del sitio -->
    
    <!-- cuadro con la foto representativa de la cultura mexicana -->
    <div class="img-box">
      <img src="https://images.unsplash.com/photo-1518638150340-f706e86654de?auto=format&fit=crop&w=1000&q=80" alt="Chichén Itzá">
    </div>
    
    <!-- mensaje o texto descriptivo breve -->
    <div class="desc">
      Mexico y sus fiestas patrias.
    </div>
  </div>
</div>

<!-- pie de pagina con los datos del alumno -->
<footer>Esparza Martinez Leonardo. 0834. 5-J</footer>

</body> 
</html>
